<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Solo carga Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="/css/stylesRegister.css">
</head>
<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-6 mx-auto form-container">
                <h2 class="text-center mb-4" th:text="#{register.title}">Registro</h2>
                
				<div class="language-switcher" style="text-align: right; margin: 10px;">
				    <a href="?lang=es" class="language-link">Español</a> | 
				    <a href="?lang=en" class="language-link">English</a> | 
				    <a href="?lang=fr" class="language-link">Français</a>
				</div>
				
				<style>
				    .language-switcher a {
				        text-decoration: none; 
				        font-size: 16px; 
				        color: #088178; 
				        padding: 5px 10px; 
				        margin: 0 5px; 
				        border-radius: 5px; 
				        transition: transform 0.3s, font-size 0.3s;
				    }

				    /* Efecto de hover: agrandar el enlace */
				    .language-switcher a:hover {
				        transform: scale(1.1); /* Agranda el enlace al pasar el mouse */
				        font-size: 18px; /* Aumenta el tamaño de la fuente */
				    }
				</style>

                <!-- Alerta de éxito, se muestra solo si "success" es true -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>¡Éxito!</strong> Su registro fue exitoso.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Alerta de error por campos vacíos, inicialmente oculto -->
                <div id="errorAlert" class="alert alert-danger alert-dismissible fade show" style="display: none;" role="alert">
                    <strong>¡Error!</strong> <span th:text="#{error.empty.fields}">Por favor, complete todos los campos requeridos.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Alerta de error por correo ya usado, inicialmente oculto -->
                <div id="emailErrorAlert" class="alert alert-warning alert-dismissible fade show" style="display: none;" role="alert">
                    <strong>¡Error!</strong> <span th:text="#{error.email.used}">El correo electrónico ingresado ya está en uso.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Alerta de error por contraseñas no coinciden, inicialmente oculto -->
                <div id="passwordErrorAlert" class="alert alert-danger alert-dismissible fade show" style="display: none;" role="alert">
                    <strong>¡Error!</strong> <span th:text="#{error.password.mismatch}">Las contraseñas no coinciden.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form id="registerForm" method="post" th:object="${registerDto}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label" th:text="#{register.firstName}">Nombre</label>
                        <div class="col-sm-8">
                            <input class="form-control" id="firstName" th:field="*{firstName}">
                            <p th:if="${#fields.hasErrors('firstName')}" class="text-danger" th:errors="${registerDto.firstName}"></p>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label" th:text="#{register.lastName}">Apellido</label>
                        <div class="col-sm-8">
                            <input class="form-control" id="lastName" th:field="*{lastName}">
                            <p th:if="${#fields.hasErrors('lastName')}" class="text-danger" th:errors="${registerDto.lastName}"></p>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label" th:text="#{register.email}">Email <i class="fas fa-envelope"></i></label>
                        <div class="col-sm-8">
                            <input class="form-control" id="email" th:field="*{email}">
                            <p th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="${registerDto.email}"></p>
                        </div>
                    </div>  

                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label" th:text="#{register.phone}">Teléfono <i class="fas fa-phone-alt"></i></label>
                        <div class="col-sm-8">
                            <input class="form-control" id="phone" th:field="*{phone}">
                            <p th:if="${#fields.hasErrors('phone')}" class="text-danger" th:errors="${registerDto.phone}"></p>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label" th:text="#{register.address}">Dirección <i class="fas fa-map-marker-alt"></i></label>
                        <div class="col-sm-8">
                            <input class="form-control" id="address" th:field="*{address}">
                            <p th:if="${#fields.hasErrors('address')}" class="text-danger" th:errors="${registerDto.address}"></p>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label" th:text="#{register.password}">Password <i class="fas fa-lock"></i></label>
                        <div class="col-sm-8 d-flex align-items-center">
                            <input id="password" class="form-control" type="password" th:field="*{password}">
                            <button type="button" class="btn btn-link" id="togglePassword" style="border: none; background: none;">
                                <i class="fas fa-eye eye-icon" id="eyeIcon"></i> <!-- Agrega la clase eye-icon -->
                            </button>
                        </div>
                        <p th:if="${#fields.hasErrors('password')}" th:errorclass="text-danger" th:errors="${registerDto.password}"></p>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label" th:text="#{register.confirmPassword}">Confirmar Password <i class="fas fa-lock"></i></label>
                        <div class="col-sm-8 d-flex align-items-center">
                            <input id="confirmPassword" class="form-control" type="password" th:field="*{confirmPassword}">
                            <button type="button" class="btn btn-link" id="toggleConfirmPassword" style="border: none; background: none;">
                                <i class="fas fa-eye eye-icon" id="eyeIconConfirm"></i> <!-- Agrega la clase eye-icon -->
                            </button>
                        </div>
                        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errorclass="text-danger" th:errors="${registerDto.confirmPassword}"></p>
                    </div>

                    <div class="row mb-3">
                        <div class="offset-sm-4 col-sm-4 d-grid">
                            <button type="submit" class="btn btn-primary" id="submitButton">
                                <i class="fas fa-paper-plane"></i> <span th:text="#{register.submit}">Enviar</span>
                            </button>
                        </div>
                        
                        <div class="col-sm-4 d-grid">
                            <a href="/" class="btn btn-outline-primary">
                                <i class="fas fa-times"></i> <span th:text="#{register.cancel}">Cancelar</span>
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Función para mostrar u ocultar la contraseña
        document.getElementById("togglePassword").addEventListener("click", function () {
            const passwordField = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passwordField.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        });

        // Función para mostrar u ocultar la confirmación de la contraseña
        document.getElementById("toggleConfirmPassword").addEventListener("click", function () {
            const confirmPasswordField = document.getElementById("confirmPassword");
            const eyeIconConfirm = document.getElementById("eyeIconConfirm");
            if (confirmPasswordField.type === "password") {
                confirmPasswordField.type = "text";
                eyeIconConfirm.classList.remove("fa-eye");
                eyeIconConfirm.classList.add("fa-eye-slash");
            } else {
                confirmPasswordField.type = "password";
                eyeIconConfirm.classList.remove("fa-eye-slash");
                eyeIconConfirm.classList.add("fa-eye");
            }
        });
    </script>
</body>
</html>
