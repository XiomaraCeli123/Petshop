<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{product.list.title}">PetShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Agregado para íconos -->
    <link rel="stylesheet" href="/css/stylesIndex.css">
</head>

<body>
    <!-- Botones de cambio de idioma -->
    <div class="language-switcher" style="text-align: right; margin: 10px;">
        <a href="?lang=es" class="language-link">Español</a> |
        <a href="?lang=en" class="language-link">English</a> |
        <a href="?lang=fr" class="language-link">Français</a>
    </div>

    <style>
        .language-switcher a {
            text-decoration: none;
            font-size: 16px;
            color: #088178;
            padding: 5px 10px;
            margin: 0 5px;
            border-radius: 5px;
            transition: transform 0.3s, font-size 0.3s;
        }

        /* Efecto de hover: agrandar el enlace */
        .language-switcher a:hover {
            transform: scale(1.1);
            /* Agranda el enlace al pasar el mouse */
            font-size: 18px;
            /* Aumenta el tamaño de la fuente */
        }
    </style>

    <div class="container">
        <h1 class="text-center my-4" id="lista-perfumes" th:text="#{product.list.title}">Lista de Productos</h1>
        <!-- Botón para descargar PDF -->
        <a class="btn btn-primary mb-3" href="/export-pdf">
            <i class="fas fa-download"></i> <span th:text="#{product.pdf.download}">Descargar PDF</span>
        </a>
        <!-- Mostrar botón Crear Producto solo para usuarios autenticados -->
        <a class="btn btn-create-product mb-3" href="/products/create">
            <i class="fas fa-plus"></i> <span th:text="#{product.create}">Crear Producto</span>
        </a>

        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th th:text="#{product.id}">ID</th>
                    <th th:text="#{product.name}">Nombre</th>
                    <th th:text="#{product.brand}">Marca</th>
                    <th th:text="#{product.category}">Categoría</th>
                    <th th:text="#{product.price}">Precio</th>
                    <th th:text="#{product.image}">Imagen</th>
                    <th th:text="#{product.createdAt}">Creado En</th>
                    <th th:text="#{product.action}">Acción</th> <!-- Solo una columna para acciones -->
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.brand}"></td>
                    <td th:text="${product.category}"></td>
                    <td th:text="${product.price} + ' $'"></td>
                    <td>
                        <img th:src="@{'/images/' + ${product.imageFileName}}" alt="..." width="100">
                    </td>
                    <td th:text="${product.createdAt.toString().substring(0, 10)}"></td>
                    <td class="accion">
                        <!-- Botón Ver -->
                        <a class="btn btn-info btn-sm" th:href="@{/products/ver (id=${product.id})}">
                            <i class="fas fa-eye"></i></span>
                        </a>
                        <!-- Botón Editar -->
                        <a class="btn btn-warning btn-sm" th:href="@{/products/edit (id=${product.id})}">
                            <i class="fas fa-edit"></i></span>
                        </a>
                        <!-- Botón Eliminar -->
                        <a class="btn btn-danger btn-sm" th:href="@{/products/delete (id=${product.id})}"
                            onclick="return confirm('¿Estás seguro de que deseas eliminar este producto?')">
                            <i class="fas fa-trash-alt"></i></span>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
